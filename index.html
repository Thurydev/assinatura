<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Card Surpresa Avançada</title>
  <link rel="stylesheet" href="style.css">

<body>
  <div class="particles">
    <div class="particle" style="top:90%; left:10%; animation-delay: 0s;"></div>

    <div class="particle" style="top:95%; left:50%; animation-delay: 4s;"></div>

    <div class="particle" style="top:85%; left:40%; animation-delay: 6s;"></div>
    <div class="particle" style="top:95%; left:60%; animation-delay: 7s;"></div>
    <div class="particle" style="top:88%; left:80%; animation-delay: 8s;"></div>
    <div class="particle" style="top:93%; left:95%; animation-delay: 9s;"></div>
  </div>

  <div class="contact-card">
    <div class="contact-header">
      <img src="gg.png" alt="Logo">

      <div class="contact-info">
        <div class="name">Gilvany Thury</div>
        <div class="title">Nine.Dev</div>
      </div>
    </div>
    <table class="social-icons" style="margin: 0 auto;">
      <tr>
        <td>
          <a href="mailto:gilvanythury10@gmail.com" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/561/561127.png" alt="Email">
          </a>
        </td>
        <td>
          <a href="https://github.com/Thurydev" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub">
          </a>
        </td>
        <td>
          <a href="https://www.instagram.com/nine_thury_/" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/1384/1384063.png" alt="Instagram">
          </a>
        </td>
        <td>
          <a href="https://www.twitch.tv/nine_999__" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111668.png" alt="Twitch">
          </a>
        </td>
      </tr>
    </table>
  </div>

  <script src="script.js"></script>

</html>
